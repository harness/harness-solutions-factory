pipeline:
  identifier: ${PIPELINE_IDENTIFIER}
  name: ${PIPELINE_NAME}
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: ${DESCRIPTION}
  tags:
    ${indent(4, TAGS)}
  stages:
    - stage:
        name: Manage Workspaces
        identifier: Manage_Workspaces
        description: ""
        %{~ if USE_HARNESS_IDP != "skipped" ~}
        type: IDP
        spec:
${IDP_STAGE_INFRASTRUCTURE}
        %{~ else ~}
        type: IACM
        spec:
          workspace: ${HSF_CORE_MANAGER}
${IACM_STAGE_INFRASTRUCTURE}
        %{~ endif ~}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone Repository
                  identifier: Clone_Repository
                  spec:
                    connectorRef: <+pipeline.variables.GIT_REPOSITORY_CONNECTOR>
                    repoName: <+pipeline.variables.GIT_REPOSITORY_NAME>
                    cloneDirectory: /harness/catalog
                    depth: 1
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.GIT_REPOSITORY_BRANCH>
              - step:
                  type: Plugin
                  name: Manage IACM Workspace
                  identifier: Manage_IACM_Workspace
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IACM_WORKSPACE_MGR>
                    settings:
                      RESOURCE_NAME: <+pipeline.variables.RESOURCE_NAME>
                      RESOURCE_OWNER: <+pipeline.variables.RESOURCE_OWNER>
                      RESOURCE_VARS: <+pipeline.variables.RESOURCE_VARS>
                      RESOURCE_VARS_FILES: <+pipeline.variables.RESOURCE_VARS_FILES>
                      RESOURCE_VARS_SECRETS: <+pipeline.variables.RESOURCE_VARS_SECRETS>
                      RESOURCE_VARS_ENVS: <+pipeline.variables.RESOURCE_VARS_ENVS>
                      RESOURCE_VARS_ENVS_SECRETS: <+pipeline.variables.RESOURCE_VARS_ENVS_SECRET>
                      GIT_REPOSITORY_CONNECTOR: <+pipeline.variables.GIT_REPOSITORY_CONNECTOR>
                      GIT_REPOSITORY_NAME: <+pipeline.variables.GIT_REPOSITORY_NAME>
                      GIT_REPOSITORY_PATH: <+pipeline.variables.GIT_REPOSITORY_PATH>
                      GIT_REPOSITORY_BRANCH: <+pipeline.variables.GIT_REPOSITORY_BRANCH>
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      HARNESS_ENDPOINT: <+pipeline.variables.HARNESS_ENDPOINT>
                      HARNESS_PORTAL_RESOURCES: <+pipeline.variables.HARNESS_PORTAL_RESOURCES>
                      HARNESS_PLATFORM_KEY: <+pipeline.variables.HARNESS_PLATFORM_KEY>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      IAC_PROVISIONER_TYPE: <+pipeline.variables.IAC_PROVISIONER_TYPE>
                      IAC_PROVISIONER_VERSION: <+pipeline.variables.IAC_PROVISIONER_VERSION>
                      IAC_PROVIDER_CONNECTOR: <+pipeline.variables.IAC_PROVIDER_CONNECTOR>
                      INCLUDE_HARNESS_ENVS: <+pipeline.variables.INCLUDE_HARNESS_ENVS>
                      WORKSPACE_ORG: <+pipeline.variables.WORKSPACE_ORG>
                      WORKSPACE_PROJECT: <+pipeline.variables.WORKSPACE_PROJECT>
                      WORKSPACE_TAGS: <+pipeline.variables.WORKSPACE_TAGS>
                      API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      HSF_ENABLED: true
                      IS_EPHEMERAL: <+pipeline.variables.IS_EPHEMERAL>
              %{~ if USE_HARNESS_IDP != "skipped" ~}
              - step:
                  type: Plugin
                  name: Register IDP Entities
                  identifier: Register_IDP_Entities
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IDP_RESOURCE_MANAGER_IMAGE>
                    settings:
                      SWITCH: register
                      ENTITY_TYPE: resource
                      HARNESS_URI: <+pipeline.variables.HARNESS_ENDPOINT.replace("/gateway","")>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      WORKING_DIR: <+execution.steps.Clone_Repository.spec.cloneDirectory>
                      ENTITY_TEMPLATE: idp_resource_templates/default_hsf_workspace_resource.yaml.j2
                      ENTITY_PAYLOAD: '{"resource_name": "<+pipeline.variables.RESOURCE_NAME.replace(" ","-").replace("-","_").toLowerCase()>", "is_resource_drifted": "true", "workspace_uri": "<+<+pipeline.variables.HARNESS_ENDPOINT>.replace("/gateway","")>/ng/account/<+account.identifier>/module/iacm/orgs/<+pipeline.variables.WORKSPACE_ORG>/projects/<+pipeline.variables.WORKSPACE_PROJECT>/workspaces/<+pipeline.variables.RESOURCE_NAME>"}'
                      ORG_ID: <+pipeline.variables.WORKSPACE_ORG>
                      PROJECT_ID: <+pipeline.variables.WORKSPACE_PROJECT>
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.REGISTER_IDP>
              %{~ endif ~}
        %{~ if HSF_PLUGIN_SSL_VERIFY_X509_STRICT == "false" ~}
        variables:
          - name: SSL_VERIFY_X509_STRICT
            type: String
            description: "Should the HSF plugins enforce strict adherance to the SSL RFC5280 (Public Key Infrastructure Certificate and Certificate Revocation List) spec?"
            required: false
            value: "${HSF_PLUGIN_SSL_VERIFY_X509_STRICT}"
        %{~ endif ~}
    - stage:
        name: Approval
        identifier: Approval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approval
                  identifier: Approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account.HSF_Admins
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.REQUIRES_APPROVAL> == "true"
    - stage:
        name: Remove Orphaned Details
        identifier: Remove_Orphaned_Details
        description: ""
        %{~ if USE_HARNESS_IDP != "skipped" ~}
        type: IDP
        spec:
${IDP_STAGE_INFRASTRUCTURE}
        %{~ else ~}
        type: IACM
        spec:
          workspace: ${HSF_CORE_MANAGER}
${IACM_STAGE_INFRASTRUCTURE}
        %{~ endif ~}
          execution:
            steps:
              %{~ if USE_HARNESS_IDP != "skipped" ~}
              - step:
                  type: Plugin
                  name: Unregister IDP Entity
                  identifier: Unregister_IDP_Entity
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IDP_RESOURCE_MANAGER_IMAGE>
                    settings:
                      SWITCH: remove
                      ENTITY_TYPE: resource
                      HARNESS_URI: <+variable.account.solutions_factory_endpoint>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      ENTITY_ID: <+pipeline.variables.RESOURCE_NAME.replace(" ","-").replace("-","_").toLowerCase()>
                      ORG_ID: <+pipeline.variables.WORKSPACE_ORG>
                      PROJECT_ID: <+pipeline.variables.WORKSPACE_PROJECT>
              %{~ endif ~}
              - step:
                  type: Plugin
                  name: Delete IACM Workspace
                  identifier: Delete_IACM_Workspace
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IACM_WORKSPACE_MGR>
                    settings:
                      SWITCH: remove
                      HARNESS_URI: <+variable.account.solutions_factory_endpoint>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      RESOURCE_NAME: <+pipeline.variables.RESOURCE_NAME>
                      WORKSPACE_ORG: <+pipeline.variables.WORKSPACE_ORG>
                      WORKSPACE_PROJECT: <+pipeline.variables.WORKSPACE_PROJECT>
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Manage_Workspaces.spec.execution.steps.Manage_IACM_Workspace.output.outputVariables.is_updated> == "false"
        tags: {}
        %{~ if HSF_PLUGIN_SSL_VERIFY_X509_STRICT == "false" ~}
        variables:
          - name: SSL_VERIFY_X509_STRICT
            type: String
            description: "Should the HSF plugins enforce strict adherance to the SSL RFC5280 (Public Key Infrastructure Certificate and Certificate Revocation List) spec?"
            required: false
            value: "${HSF_PLUGIN_SSL_VERIFY_X509_STRICT}"
        %{~ endif ~}
        when:
          pipelineStatus: Failure
          condition: <+pipeline.variables.REQUIRES_APPROVAL> == "true"
    - stage:
        name: Provision
        identifier: Provision
        description: ""
        type: IACM
        spec:
${IACM_STAGE_INFRASTRUCTURE}
          workspace: <+pipeline.variables.RESOURCE_NAME>
          execution:
            steps:
              - stepGroup:
                  name: Workspace Preparation
                  identifier: Preparation
                  steps:
                    - step:
                        type: IACMOpenTofuPlugin
                        name: init
                        identifier: init
                        timeout: 10m
                        spec:
                          command: init
                          %{~ if KUBERNETES_IMAGE_NAME != "skipped" ~}
                          image: ${KUBERNETES_IMAGE_NAME}
                          %{~ endif ~}
                    - step:
                        type: IACMOpenTofuPlugin
                        name: plan
                        identifier: plan
                        timeout: 10m
                        spec:
                          command: plan
                          %{~ if KUBERNETES_IMAGE_NAME != "skipped" ~}
                          image: ${KUBERNETES_IMAGE_NAME}
                          %{~ endif ~}
                    - step:
                        type: IACMApproval
                        name: Approve Changes
                        identifier: Approve_Changes
                        spec:
                          autoApprove: true
                        timeout: 1h
                        when:
                          stageStatus: Success
                          condition: <+pipeline.variables.REQUIRES_APPROVAL> == "true"
                      contextType: Pipeline
              - stepGroup:
                  name: Workspace Provision
                  identifier: Provision
                  steps:
                    - step:
                        type: IACMOpenTofuPlugin
                        name: apply
                        identifier: apply
                        timeout: 1h
                        spec:
                          command: apply
                          %{~ if KUBERNETES_IMAGE_NAME != "skipped" ~}
                          image: ${KUBERNETES_IMAGE_NAME}
                          %{~ endif ~}
              %{~ if USE_HARNESS_IDP != "skipped" ~}
                    - step:
                        type: Plugin
                        name: Update Workspace In IDP
                        identifier: Update_Workspace_In_IDP
                        spec:
                          connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                          image: <+pipeline.variables.HARNESS_IDP_RESOURCE_MANAGER_IMAGE>
                          settings:
                            SWITCH: property
                            ENTITY_TYPE: resource
                            HARNESS_URI: <+variable.account.solutions_factory_endpoint>
                            HARNESS_ACCT: <+account.identifier>
                            HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                            ENTITY_ID: <+<+workspace.identifier.replace(" ","-").replace("-","_")>.toLowerCase()>
                            HSF_PROPERTY: metadata.hsf.is_drifted
                            HSF_Value: false
                            ORG_ID: <+org.identifier>
                            PROJECT_ID: <+project.identifier>
              %{~ endif ~}
        tags: {}
        %{~ if HSF_PLUGIN_SSL_VERIFY_X509_STRICT == "false" ~}
        variables:
          - name: SSL_VERIFY_X509_STRICT
            type: String
            description: "Should the HSF plugins enforce strict adherance to the SSL RFC5280 (Public Key Infrastructure Certificate and Certificate Revocation List) spec?"
            required: false
            value: "${HSF_PLUGIN_SSL_VERIFY_X509_STRICT}"
        %{~ endif ~}
        when:
          pipelineStatus: Success
          condition: (<+pipeline.variables.WORKSPACE_ORG> == <+org.identifier>) && (<+pipeline.variables.WORKSPACE_PROJECT> == <+project.identifier>)
    - stage:
        name: Remove Ephemeral Workspaces
        identifier: Remove_Ephemeral_Workspaces
        description: ""
        %{~ if USE_HARNESS_IDP != "skipped" ~}
        type: IDP
        spec:
${IDP_STAGE_INFRASTRUCTURE}
        %{~ else ~}
        type: IACM
        spec:
          workspace: ${HSF_CORE_MANAGER}
${IACM_STAGE_INFRASTRUCTURE}
        %{~ endif ~}
          execution:
            steps:
              %{~ if USE_HARNESS_IDP != "skipped" ~}
              - step:
                  type: Plugin
                  name: Unregister IDP Entity
                  identifier: Unregister_IDP_Entity
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IDP_RESOURCE_MANAGER_IMAGE>
                    settings:
                      SWITCH: remove
                      ENTITY_TYPE: resource
                      HARNESS_URI: <+variable.account.solutions_factory_endpoint>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      ENTITY_ID: <+pipeline.variables.RESOURCE_NAME.replace(" ","-").replace("-","_").toLowerCase()>
                      ORG_ID: <+pipeline.variables.WORKSPACE_ORG>
                      PROJECT_ID: <+pipeline.variables.WORKSPACE_PROJECT>
              %{~ endif ~}
              - step:
                  type: Plugin
                  name: Delete IACM Workspace
                  identifier: Delete_IACM_Workspace
                  spec:
                    connectorRef: <+pipeline.variables.REGISTRY_CONNECTOR_ID>
                    image: <+pipeline.variables.HARNESS_IACM_WORKSPACE_MGR>
                    settings:
                      SWITCH: remove
                      HARNESS_URI: <+variable.account.solutions_factory_endpoint>
                      HARNESS_ACCT: <+account.identifier>
                      HARNESS_API_KEY: <+secrets.getValue(<+pipeline.variables.HARNESS_PLATFORM_KEY>)>
                      RESOURCE_NAME: <+pipeline.variables.RESOURCE_NAME>
                      WORKSPACE_ORG: <+pipeline.variables.WORKSPACE_ORG>
                      WORKSPACE_PROJECT: <+pipeline.variables.WORKSPACE_PROJECT>
        tags: {}
        %{~ if HSF_PLUGIN_SSL_VERIFY_X509_STRICT == "false" ~}
        variables:
          - name: SSL_VERIFY_X509_STRICT
            type: String
            description: "Should the HSF plugins enforce strict adherance to the SSL RFC5280 (Public Key Infrastructure Certificate and Certificate Revocation List) spec?"
            required: false
            value: "${HSF_PLUGIN_SSL_VERIFY_X509_STRICT}"
        %{~ endif ~}
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.IS_EPHEMERAL> == "true"
  variables:
    - name: RESOURCE_NAME
      type: String
      description: Enter the IACM Workspace name to create or update
      required: true
      value: <+input>
    - name: RESOURCE_OWNER
      type: String
      description: Enter the IDP group or user to whom to assign ownership
      required: true
      value: <+input>.default("user:account/<+pipeline.triggeredBy.email>")
    - name: RESOURCE_VARS
      type: String
      description: Provide a JSON object of Key:Value pairs of standard Terraform variables
      required: false
      value: <+input>.default({})
    - name: RESOURCE_VARS_FILES
      type: String
      description: Provide a JSON list of Objects for standard Terraform variable files. e.g [{"repository_connector":"account.mySCM","repository":"<+workspace.envVars.repo_name>","repository_branch":"<+workspace.envVars.branch_name>","repository_path":"<+workspace.envVars.file_path>"}]
      required: false
      value: <+input>.default([])
    - name: RESOURCE_VARS_SECRETS
      type: String
      description: Provide a JSON object of Key:Value pairs of standard Terraform variables with Harness Secret References
      required: false
      value: <+input>.default({})
    - name: RESOURCE_VARS_ENVS
      type: String
      description: Provide a JSON object of Key:Value pairs of standard Environment variables
      required: false
      value: <+input>.default({})
    - name: RESOURCE_VARS_ENVS_SECRET
      type: String
      description: Provide a JSON object of Key:Value pairs of standard Environment variables with Harness Secret References
      required: false
      value: <+input>.default({})
    - name: GIT_REPOSITORY_BRANCH
      type: String
      description: ""
      required: false
      value: <+input>.default(${GIT_REPOSITORY_BRANCH})
    - name: GIT_REPOSITORY_CONNECTOR
      type: String
      description: ""
      required: false
      value: <+input>.default(${GIT_REPOSITORY_CONNECTOR})
    - name: GIT_REPOSITORY_NAME
      type: String
      description: ""
      required: false
      value: <+input>.default(${GIT_REPOSITORY_NAME})
    - name: GIT_REPOSITORY_PATH
      type: String
      description: ""
      required: false
      value: <+input>.default()
    - name: HARNESS_ACCOUNT_ID
      type: String
      description: ""
      required: true
      value: <+account.identifier>
    - name: HARNESS_ENDPOINT
      type: String
      description: ""
      required: true
      value: <+variable.org.HARNESS_ENDPOINT>
    - name: HARNESS_PORTAL_RESOURCES
      type: String
      description: ""
      required: true
      value: <+variable.org.HARNESS_PORTAL_RESOURCES>
    - name: HARNESS_PLATFORM_KEY
      type: String
      description: ""
      required: true
      value: ${HARNESS_PLATFORM_API_KEY}
    - name: IAC_PROVISIONER_TYPE
      type: String
      description: ""
      required: false
      value: <+input>.default(${IAC_PROVISIONER_TYPE})
    - name: IAC_PROVISIONER_VERSION
      type: String
      description: ""
      required: false
      value: <+input>.default(${IAC_PROVISIONER_VERSION})
    - name: IAC_PROVIDER_CONNECTOR
      type: String
      description: ""
      required: false
      value: <+input>.default()
    - name: INCLUDE_HARNESS_ENVS
      type: String
      description: ""
      required: false
      value: <+input>.default(false).selectOneFrom(true,false)
    - name: REGISTER_IDP
      type: String
      description: Register the IaCM workspace in IDP
      required: false
    %{~ if USE_HARNESS_IDP != "skipped" ~}
      value: <+input>.default(true).selectOneFrom(true,false)
    %{~ else ~}
      value: <+input>.default(false).selectOneFrom(true,false)
    %{~ endif ~}
    - name: IS_EPHEMERAL
      type: String
      description: If configured as ephemeral, then the IDP resource will not be registered nor managed
      required: false
      value: <+input>.default(false).selectOneFrom(true,false)
    - name: REQUIRES_APPROVAL
      type: String
      description: If "true", then the pipeline will require approval before being marked complete. If not, approved, then any IACM or IDP resource created will be removed.
      required: false
      value: <+input>.default(false).selectOneFrom(true,false)
    - name: WORKSPACE_ORG
      type: String
      description: ""
      required: false
      value: <+input>.default(${WORKSPACE_ORG})
    - name: WORKSPACE_PROJECT
      type: String
      description: ""
      required: false
      value: <+input>.default(${WORKSPACE_PROJECT})
    - name: WORKSPACE_TAGS
      type: String
      description: ""
      required: false
      value: <+input>.default({})
    - name: REGISTRY_CONNECTOR_ID
      type: String
      description: Existing Registry Connector used to retrieve container images.
      required: true
      value: ${DOCKER_REGISTRY_ID}
    - name: HARNESS_IACM_WORKSPACE_MGR
      type: String
      description: Harness Script Manager for running Python API SDK
      required: true
      value: ${HSF_IACM_WORKSPACE_MGR_IMAGE}
    - name: HARNESS_IDP_RESOURCE_MANAGER_IMAGE
      type: String
      description: Harness IDP Resource Manager for managing IDP Resources
      required: true
      value: ${HSF_IDP_RESOURCE_MGR_IMAGE}
